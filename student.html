<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل دانش‌آموز | مدرسه گیم</title><link rel="stylesheet" href="styles.css"></head><body data-page="student" class="app-page"><header class="appbar"><a href="index.html" class="brand mini"><span>🎮</span><b>مدرسه گیم</b></a><div class="app-actions"><span id="studentNameBadge"></span><button class="ghost" id="changeStudentName">تغییر نام</button></div></header><main class="dashboard"><section class="dashboard-head"><div><span class="eyebrow">پنل دانش‌آموز</span><h1>سلام <span id="studentNameTitle">👋</span></h1><p>رشته‌ات را انتخاب کن تا کلاس‌ها، جلسه‌ها و کارنامه را ببینی.</p></div><div class="status-card"><span>وضعیت اتصال</span><strong id="studentConnection">در حال اتصال...</strong><label style="display:block;margin-top:9px;color:#9db4c9;font-size:11px">پایه<select id="studentGrade" style="display:block;width:100%;margin-top:5px;background:#071422;color:#eef7ff;border:1px solid #1b3650;border-radius:9px;padding:8px"><option value="1">۱</option><option value="2">۲</option><option value="3">۳</option><option value="4">۴</option><option value="5">۵</option><option value="6">۶</option><option value="7">۷</option><option value="8">۸</option><option value="9">۹</option><option value="10">۱۰</option><option value="11">۱۱</option><option value="12">۱۲</option></select></label></div></section><section class="section-title"><h2>رشته‌های مدرسه</h2><p>هر رشته اتاق درس خودش را دارد.</p></section><div id="subjectsGrid" class="subject-grid"></div><section class="student-lower"><div class="panel"><div class="panel-head"><h2>کلاس‌های من</h2><span id="selectedSubjectLabel">همه رشته‌ها</span></div><div id="studentClasses" class="class-list empty">برای دیدن کلاس‌ها یک رشته را انتخاب کن.</div></div><div class="panel"><div class="panel-head"><h2>کارنامه</h2><span>ترم‌ها</span></div><div id="studentGrades" class="grades"></div></div></section></main>
