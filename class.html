<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کلاس آنلاین | مدرسه گیم</title><link rel="stylesheet" href="styles.css"></head><body data-page="class" class="class-page"><header class="classbar"><div><a href="student.html" id="backPortal" class="brand mini"><span>🎮</span><b>مدرسه گیم</b></a><span id="roomTitle" class="room-title"></span></div><div class="class-actions"><span id="roomStatus" class="live-pill">● اتصال</span><button id="micBtn" class="control">🎙️ میکروفون</button><button id="speakerBtn" class="control">🔊 صدا</button><button id="leaveBtn" class="danger">خروج</button></div></header><main class="class-layout"><section class="whiteboard-panel"><div class="board-head"><div><b>تخته کلاس</b><small>همه می‌توانند روی تخته کار کنند</small></div><button id="clearBoard" class="ghost teacher-only">پاک کردن تخته</button></div><canvas id="whiteboard"></canvas></section><aside class="class-sidebar"><section class="mini-panel"><div class="mini-head"><b>حاضران</b><span id="onlineCount">۰</span></div><div id="participants"></div></section><section class="mini-panel chat-panel"><div class="chat-tabs"><button class="active" data-chat="group">چت گروهی</button><button data-chat="teacher">چت با معلم</button></div><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" autocomplete="off" placeholder="پیام بنویس..."><button>➤</button></form></section><section class="mini-panel teacher-audio"><div class="mini-head"><b>صدای کلاس</b><span id="audioState">خاموش</span></div><audio id="remoteAudio" autoplay controls></audio><div id="studentMicControls"></div></section></aside></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
