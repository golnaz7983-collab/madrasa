<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل معلم | مدرسه گیم</title><link rel="stylesheet" href="styles.css"></head><body data-page="teacher" class="app-page"><header class="appbar"><a href="index.html" class="brand mini"><span>🎮</span><b>مدرسه گیم</b></a><div class="app-actions"><span id="teacherNameBadge"></span><button class="ghost" id="changeTeacherName">تغییر نام</button></div></header><main class="dashboard"><section class="dashboard-head"><div><span class="eyebrow">پنل معلم</span><h1>اتاق فرمان کلاس‌ها 🧑‍🏫</h1><p>کلاس را برای یک رشته و ساعت مشخص بساز؛ دانش‌آموزها از پنل خودشان وارد می‌شوند.</p></div><div class="status-card"><span>دانش‌آموزان ثبت‌شده</span><strong id="teacherStudentCount">۰</strong></div></section><section class="teacher-layout"><div class="panel"><div class="panel-head"><h2>ساخت کلاس جدید</h2><span>جلسه ۱ تا ۳۲</span></div><form id="createClassForm" class="form-grid"><label>رشته<select id="classSubject"></select></label><label>ترم<input id="classTerm" type="number" min="1" value="1"></label><label>شماره جلسه<input id="classSession" type="number" min="1" max="32" value="1"></label><label>عنوان درس<input id="classTitle" required placeholder="مثلاً آشنایی با ساخت جهان"></label><label>تاریخ و ساعت<input id="classStart" type="datetime-local" required></label><label>مدت (دقیقه)<input id="classDuration" type="number" min="15" value="60"></label><button class="primary wide" type="submit">＋ ساخت اتاق درس</button></form></div><div class="panel"><div class="panel-head"><h2>کلاس‌های من</h2><span id="teacherClassCount">۰</span></div><div id="teacherClasses" class="class-list"></div></div></section><section class="teacher-lower"><div class="panel"><div class="panel-head"><h2>دانش‌آموزان</h2><span>قابل مشاهده برای معلم</span></div><div id="teacherStudents" class="students-table"></div></div><div class="panel"><div class="panel-head"><h2>ثبت نمره پایان ترم</h2><span>۰ تا ۲۰</span></div><form id="gradeForm" class="form-grid"><label>دانش‌آموز<select id="gradeStudent" required></select></label><label>رشته<select id="gradeSubject"></select></label><label>ترم<input id="gradeTerm" type="number" min="1" value="1"></label><label>نمره<input id="gradeScore" type="number" min="0" max="20" step="0.25" required></label><label class="full">توضیح<input id="gradeNote" placeholder="توضیح کوتاه معلم"></label><button class="primary wide" type="submit">ثبت نمره</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
